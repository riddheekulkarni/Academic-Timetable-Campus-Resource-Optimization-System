<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Portal - Academic Operations</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/timetable.css">
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </div>
        <div>
          <div class="brand-title">Faculty Portal</div>
          <div class="brand-subtitle">Teaching &amp; Labs</div>
        </div>
      </div>

      <div class="sidebar-profile">
        <div class="profile-avatar" id="userAvatar">F</div>
        <div class="profile-info">
          <div class="profile-name" id="userName">Faculty Member</div>
          <div class="profile-role" id="userEmail">Loading...</div>
        </div>
      </div>

      <nav>
        <div class="nav-category">My Workspace</div>
        <a href="/faculty/dashboard.html" class="active">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          Assigned Teaching Schedule
        </a>

        <div class="sidebar-footer">
          <a href="#" onclick="Auth.logout()" class="logout-btn">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Sign Out
          </a>
        </div>
      </nav>
    </aside>

    <main class="main-content">
      <div class="header-bar">
        <div class="header-title-group">
          <h1>Assigned Teaching Schedule</h1>
          <p>Allocated lecture slots, laboratory sessions, assigned divisions, and room numbers.</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-secondary" onclick="window.print()">
            <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            Print Schedule
          </button>
        </div>
      </div>

      <div id="faculty-timetable-container">
        <div class="status-card" style="text-align: center; padding: 40px; color: var(--text-muted);">
          <p>Loading your teaching timetable grid...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/timetable.js"></script>
  <script src="/js/faculty.js"></script>
</body>
</html>
