<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Academic Operations Platform</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #090d16 100%);
      position: relative;
      overflow: hidden;
    }

    .auth-page::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.15) 0%, rgba(37, 99, 235, 0) 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .auth-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      z-index: 1;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.98);
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5);
      padding: 44px 40px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: var(--color-accent-gradient);
      color: #ffffff;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.35);
    }

    .auth-logo svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .auth-brand h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .auth-brand p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      background: var(--color-accent-gradient);
      color: #ffffff;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.15s ease;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .auth-btn:hover {
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
    }

    .auth-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      padding: 4px;
    }

    .password-toggle:hover {
      color: var(--text-main);
    }

    .auth-footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 12px;
      z-index: 1;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-body">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
        <h1>Academic Operations Portal</h1>
        <p>Sign in to access your timetable and institutional management</p>
      </div>

      <div id="loginAlert" style="display: none;" class="alert alert-error"></div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="e.g. name@gmail.com"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">Show</button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="auth-btn">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <footer class="auth-footer">
    Academic Timetable &amp; Campus Resource Optimization System &copy; 2026
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById("password");
      const toggleBtn = event.target;
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        toggleBtn.textContent = "Hide";
      } else {
        pwdInput.type = "password";
        toggleBtn.textContent = "Show";
      }
    }

    async function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const alertBox = document.getElementById("loginAlert");
      const btn = document.getElementById("loginBtn");

      alertBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Authenticating...";

      try {
        const res = await api.post("/api/login", { email, password });
        if (res.success && res.token) {
          Auth.setSession(res.token, res.user);
          Auth.redirectByRole(res.user.role);
        } else {
          alertBox.textContent = res.message || "Invalid credentials. Please verify your email and password.";
          alertBox.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Sign In";
        }
      } catch (err) {
        alertBox.textContent = "Unable to connect to the authentication server.";
        alertBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>
